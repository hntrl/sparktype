[project]
name = "sparktype-fastapi-example"
version = "1.0.0"
description = "Example FastAPI application using sparktype for type-safe API development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "sparktype",
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.types.*"
# Generated files may have some patterns mypy doesn't like
disable_error_code = ["misc"]

