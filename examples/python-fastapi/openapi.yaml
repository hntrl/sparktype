openapi: "3.0.3"
info:
  title: Task Management API
  version: "1.0.0"
  description: |
    A task management API demonstrating sparktype with Python/FastAPI.
    Shows how generated TypedDicts work with FastAPI's request/response handling.

paths:
  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /tasks/{task_id}:
    get:
      summary: Get a task
      operationId: getTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update a task
      operationId: updateTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    delete:
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted

  /projects:
    get:
      summary: List projects
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /users:
    get:
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    # Task schemas
    Task:
      type: object
      description: A task in the system
      required:
        - id
        - title
        - status
        - priority
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Task title
        description:
          type: string
          description: Detailed task description
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          $ref: '#/components/schemas/User'
        project_id:
          type: string
          format: uuid
          description: ID of the project this task belongs to
        labels:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date
          description: Task due date
        estimated_hours:
          type: number
          description: Estimated hours to complete
          minimum: 0
        completed_at:
          type: string
          format: date-time
          description: When the task was completed
        created_at:
          type: string
          format: date-time
          description: When the task was created
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
          readOnly: true

    TaskStatus:
      type: string
      description: Task status
      enum:
        - todo
        - in_progress
        - review
        - done
        - cancelled

    Priority:
      type: string
      description: Task priority level
      enum:
        - low
        - medium
        - high
        - urgent

    CreateTaskRequest:
      type: object
      description: Request body for creating a task
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        labels:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date
        estimated_hours:
          type: number
          minimum: 0

    UpdateTaskRequest:
      type: object
      description: Request body for updating a task
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string
          format: uuid
          nullable: true
        labels:
          type: array
          items:
            type: string
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: number
          minimum: 0
          nullable: true

    # Project schemas
    Project:
      type: object
      description: A project containing tasks
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code for the project
        task_count:
          type: integer
          description: Number of tasks in the project
        owner:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
          readOnly: true

    CreateProjectRequest:
      type: object
      description: Request body for creating a project
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    # User schemas
    User:
      type: object
      description: A user in the system
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          type: string
          format: uri

    # Error schemas
    ErrorResponse:
      type: object
      description: Standard error response
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        request_id:
          type: string
          description: Request ID for debugging

    ValidationError:
      type: object
      description: Validation error response
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'

    ValidationErrorDetail:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            type: string
        msg:
          type: string
        type:
          type: string

