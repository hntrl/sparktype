openapi: "3.0.0"
info:
  title: Test API
  version: "1.0.0"
paths: {}
components:
  schemas:
    User:
      type: object
      description: A user account
      required:
        - id
        - email
      properties:
        id:
          type: integer
          description: Unique identifier
        email:
          type: string
          format: email
          description: Email address
        name:
          type: string
          description: Display name
    Status:
      type: string
      enum:
        - active
        - inactive

