version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - misspell

  settings:
    govet:
      disable:
        - fieldalignment

    gocritic:
      disabled-checks:
        - appendAssign
        - ifElseChain
        - deprecatedComment

    misspell:
      locale: US

    staticcheck:
      checks:
        - all
        - -QF1003
        - -QF1006
        - -ST1000
        - -ST1003
        - -ST1020

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

      - path: testdata/
        linters:
          - errcheck

      - path: internal/generators/.*/parser\.go
        linters:
          - errcheck

      - path: internal/parser/
        linters:
          - errcheck

      - path: internal/spec/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/hntrl/sparktype

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
