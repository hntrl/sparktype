version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    - wsl
    - nlreturn
    - gochecknoglobals
    - funlen
    - gocognit
    - cyclop
    - maintidx
    - lll
    - varnamelen
    - ireturn
    - exhaustruct
    - depguard
    - tagliatelle
    - godox
    - err113
    - wrapcheck
    - testpackage
    - paralleltest
    - tparallel
    - nilerr

  settings:
    govet:
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst

      - path: testdata/
        linters:
          - errcheck
          - gosec
          - govet

      - path: internal/cli/
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/hntrl/sparktype

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
